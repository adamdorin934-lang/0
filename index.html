<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY STEAM</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #171a21;
    color: #ffffff;
}

/* =========================
   HEADER
========================= */

header {
    height: 70px;
    background: #171a21;
    border-bottom: 1px solid #2a2f38;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #66c0f4;
    letter-spacing: 1px;
}

nav {
    display: flex;
    gap: 28px;
}

nav a {
    color: #d6d7d8;
    text-decoration: none;
    font-size: 15px;
    cursor: pointer;
}

nav a:hover {
    color: #66c0f4;
}

.search {
    background: #2a2f38;
    border: 1px solid #3a414c;
    color: white;

    padding: 10px 15px;
    width: 220px;

    outline: none;
}

.search::placeholder {
    color: #8f98a3;
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 320px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 50px 8%;

    background:
        linear-gradient(
            90deg,
            rgba(23,26,33,1) 0%,
            rgba(23,26,33,.9) 45%,
            rgba(23,26,33,.3) 100%
        ),
        radial-gradient(
            circle at right,
            #1b4b68,
            #171a21 60%
        );
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

.hero p {
    max-width: 600px;
    color: #c7d5e0;
    font-size: 18px;
    line-height: 1.6;
}

/* =========================
   CONTENT
========================= */

.container {
    width: 86%;
    max-width: 1400px;
    margin: 40px auto;
}

.section-title {
    font-size: 25px;
    margin-bottom: 25px;
}

/* =========================
   GAME GRID
========================= */

.games {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));

    gap: 25px;
}

/* =========================
   GAME CARD
========================= */

.game-card {
    background: #1e232b;

    border: 1px solid #303641;

    transition:
        transform .2s,
        box-shadow .2s,
        border-color .2s;

    overflow: hidden;
}

.game-card:hover {
    transform: translateY(-5px);

    border-color: #66c0f4;

    box-shadow:
        0 10px 30px rgba(0,0,0,.4);
}

.game-image {
    width: 100%;
    height: 160px;

    object-fit: cover;

    display: block;

    background: #101217;
}

.game-content {
    padding: 18px;
}

.game-name {
    font-size: 19px;
    font-weight: bold;

    margin-bottom: 8px;
}

.game-description {
    color: #9ca8b5;

    font-size: 14px;

    line-height: 1.5;

    min-height: 42px;

    margin-bottom: 18px;
}

.play-button {
    display: block;

    width: 100%;

    padding: 12px;

    border: none;

    background: linear-gradient(
        90deg,
        #75c8f5,
        #4aa3d8
    );

    color: #ffffff;

    font-weight: bold;

    cursor: pointer;

    text-align: center;

    text-decoration: none;
}

.play-button:hover {
    background: linear-gradient(
        90deg,
        #8bd2f7,
        #5ab1e2
    );
}

/* =========================
   EMPTY SEARCH
========================= */

.no-results {
    display: none;

    text-align: center;

    color: #8f98a3;

    padding: 50px;

    font-size: 18px;
}

/* =========================
   GAME PLAYER
========================= */

.player {
    display: none;

    position: fixed;

    inset: 0;

    background: #0e1116;

    z-index: 1000;

    flex-direction: column;
}

.player-header {
    height: 60px;

    background: #171a21;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    border-bottom: 1px solid #303641;
}

.player-title {
    font-size: 18px;
    font-weight: bold;
}

.close-player {
    background: #2a2f38;

    color: white;

    border: none;

    padding: 10px 18px;

    cursor: pointer;
}

.close-player:hover {
    background: #c0392b;
}

.game-frame {
    flex: 1;

    width: 100%;

    border: none;

    background: white;
}

/* =========================
   FOOTER
========================= */

footer {
    margin-top: 80px;

    padding: 30px;

    text-align: center;

    border-top: 1px solid #2a2f38;

    color: #687380;

    font-size: 14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    header {
        height: auto;

        padding: 18px 5%;

        flex-wrap: wrap;

        gap: 15px;
    }

    nav {
        order: 3;

        width: 100%;

        justify-content: center;
    }

    .search {
        width: 170px;
    }

    .hero h1 {
        font-size: 35px;
    }

    .container {
        width: 92%;
    }

    .games {
        grid-template-columns:
            repeat(auto-fill, minmax(220px, 1fr));
    }
}
</style>
</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        MY STEAM
    </div>

    <nav>
        <a onclick="scrollToGames()">Hry</a>
        <a onclick="showFavorites()">⭐ Obľúbené</a>
    </nav>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔍 Hľadať hry..."
        oninput="searchGames()"
    >

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

    <h1>Objav nové hry</h1>

    <p>
        Vitaj na MY STEAM.
        Vyber si hru a začni hrať.
    </p>

</section>


<!-- =====================================================
     GAMES
===================================================== -->

<main class="container">

    <h2 class="section-title">
        Hry
    </h2>

    <div id="games" class="games"></div>

    <div id="noResults" class="no-results">
        Žiadna hra nebola nájdená.
    </div>

</main>


<!-- =====================================================
     GAME PLAYER
===================================================== -->

<div id="player" class="player">

    <div class="player-header">

        <div id="playerTitle" class="player-title">
            Hra
        </div>

        <button
            class="close-player"
            onclick="closeGame()"
        >
            ✕ Zavrieť
        </button>

    </div>

    <iframe
        id="gameFrame"
        class="game-frame"
        allowfullscreen
    ></iframe>

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    MY STEAM © 2026

</footer>


<script>

/* ========================================================
   HRY
========================================================

   1 BLOK = 1 HRA

   Skopíruj celý blok a zmeň:

   name        = názov hry
   description = popis
   image       = link na obrázok
   link        = link na HTML hru

======================================================== */


/* ========================================================
   SLOT 1
======================================================== */

addGame({

    name: "Space Adventure",

    description:
        "Vydaj sa na vesmírne dobrodružstvo.",

    image:
        "https://images.unsplash.com/photo-1446776877081-d282a0f896e2?auto=format&fit=crop&w=900&q=80",

    link:
        "https://example.com/game.html"

});


/* ========================================================
   SLOT 2
======================================================== */

addGame({

    name: "Racing Game",

    description:
        "Sadni do auta a vyhraj preteky.",

    image:
        "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=80",

    link:
        "https://example.com/racing.html"

});


/* ========================================================
   SLOT 3
======================================================== */

addGame({

    name: "Zombie Attack",

    description:
        "Preži útok zombie a zostaň nažive.",

    image:
        "https://images.unsplash.com/photo-1578662996442-48f60103fc96?auto=format&fit=crop&w=900&q=80",

    link:
        "https://example.com/zombie.html"

});


/* ========================================================
   TEMPLATE
========================================================

   SKOPÍRUJ TENTO CELÝ BLOK PRE NOVÚ HRU

======================================================== */


/*

addGame({

    name: "NÁZOV HRY",

    description:
        "POPIS HRY",

    image:
        "LINK NA OBRÁZOK",

    link:
        "LINK NA HRU"

});

*/


/* ========================================================
   GAME SYSTEM
======================================================== */

const games = [];

const favorites = new Set();


function addGame(game) {

    if (!game) return;

    if (!game.name) return;

    games.push({

        name:
            game.name,

        description:
            game.description || "",

        image:
            game.image || "",

        link:
            game.link || ""

    });

}


/* ========================================================
   VYKRESLENIE HIER
======================================================== */

function renderGames(list = games) {

    const container =
        document.getElementById("games");

    const noResults =
        document.getElementById("noResults");

    container.innerHTML = "";

    if (list.length === 0) {

        noResults.style.display = "block";

        return;

    }

    noResults.style.display = "none";


    list.forEach((game, index) => {

        const card =
            document.createElement("div");

        card.className =
            "game-card";


        const image =
            game.image ||
            createPlaceholder(game.name);


        card.innerHTML = `

            <img
                class="game-image"
                src="${escapeAttribute(image)}"
                alt="${escapeAttribute(game.name)}"
                onerror="this.src='${createPlaceholder(game.name)}'"
            >

            <div class="game-content">

                <div class="game-name">
                    ${escapeHtml(game.name)}
                </div>

                <div class="game-description">
                    ${escapeHtml(game.description)}
                </div>

                <a
                    class="play-button"
                    href="#"
                    onclick="openGame(${index}); return false;"
                >
                    ▶ HRAŤ
                </a>

            </div>

        `;

        container.appendChild(card);

    });

}


/* ========================================================
   OTVORENIE HRY
======================================================== */

function openGame(index) {

    const game =
        games[index];

    if (!game) return;


    /*
       Hra sa otvorí priamo v iframe.
    */

    if (!game.link) {

        alert("Táto hra nemá nastavený link.");

        return;

    }


    document.getElementById("playerTitle")
        .textContent = game.name;


    document.getElementById("gameFrame")
        .src = game.link;


    document.getElementById("player")
        .style.display = "flex";

}


/* ========================================================
   ZATVORENIE HRY
======================================================== */

function closeGame() {

    document.getElementById("player")
        .style.display = "none";


    document.getElementById("gameFrame")
        .src = "";

}


/* ========================================================
   VYHĽADÁVANIE
======================================================== */

function searchGames() {

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();


    if (!search) {

        renderGames(games);

        return;

    }


    const filtered =
        games.filter(game =>

            game.name
                .toLowerCase()
                .includes(search)

            ||

            game.description
                .toLowerCase()
                .includes(search)

        );


    renderGames(filtered);

}


/* ========================================================
   OBLÚBENÉ
======================================================== */

function showFavorites() {

    alert(
        "Obľúbené hry môžeme doplniť v ďalšej verzii."
    );

}


/* ========================================================
   SCROLL NA HRY
======================================================== */

function scrollToGames() {

    document.querySelector(".container")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* ========================================================
   PLACEHOLDER OBRÁZOK
======================================================== */

function createPlaceholder(name) {

    const text =
        encodeURIComponent(name);

    return `
        data:image/svg+xml;charset=UTF-8,
        <svg xmlns="http://www.w3.org/2000/svg"
             width="900"
             height="500">

            <rect
                width="100%"
                height="100%"
                fill="%231e232b"/>

            <text
                x="50%"
                y="50%"
                fill="%2366c0f4"
                font-size="42"
                font-family="Arial"
                text-anchor="middle"
                dominant-baseline="middle">

                ${text}

            </text>

        </svg>
    `.replace(/\s+/g, " ");

}


/* ========================================================
   OCHRANA HTML
======================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* ========================================================
   SPUSTENIE
======================================================== */

renderGames();

</script>

</body>
</html>
