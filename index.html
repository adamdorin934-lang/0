<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY STEAM</title>

<style>
/* =========================================================
   ZÁKLAD
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #171a21;
    color: #fff;
    min-height: 100vh;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;

    height: 72px;

    display: flex;
    align-items: center;
    gap: 35px;

    padding: 0 5%;

    background: #171a21;
    border-bottom: 1px solid #2d333d;
}

.logo {
    font-size: 26px;
    font-weight: 800;
    color: #66c0f4;
    white-space: nowrap;
}

.nav {
    display: flex;
    gap: 25px;
}

.nav button {
    background: none;
    border: none;

    color: #c7d5e0;

    font-size: 15px;
    cursor: pointer;
}

.nav button:hover {
    color: #66c0f4;
}

.search-box {
    margin-left: auto;

    width: 240px;
    height: 38px;

    padding: 0 14px;

    background: #10151c;
    border: 1px solid #3a414c;

    color: #fff;
    outline: none;
}

.search-box:focus {
    border-color: #66c0f4;
}

.search-box::placeholder {
    color: #75808c;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    min-height: 330px;

    display: flex;
    align-items: center;

    padding: 50px 8%;

    background:
        linear-gradient(
            90deg,
            #171a21 0%,
            rgba(23,26,33,.94) 40%,
            rgba(23,26,33,.45) 100%
        ),
        radial-gradient(
            circle at 80% 50%,
            #205275 0%,
            #171a21 60%
        );
}

.hero-content {
    max-width: 700px;
}

.hero h1 {
    font-size: clamp(38px, 6vw, 62px);
    margin-bottom: 18px;
}

.hero p {
    color: #c7d5e0;
    font-size: 18px;
    line-height: 1.6;
}

/* =========================================================
   HLAVNÝ OBSAH
========================================================= */

.container {
    width: 90%;
    max-width: 1450px;
    margin: 45px auto;
}

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.section-heading h2 {
    font-size: 28px;
}

.game-count {
    color: #7d8b99;
    font-size: 14px;
}

/* =========================================================
   HRY
========================================================= */

.games-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));

    gap: 25px;
}

/* =========================================================
   KARTA HRY
========================================================= */

.game-card {
    background: #1e232b;

    border: 1px solid #303641;

    overflow: hidden;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.game-card:hover {
    transform: translateY(-5px);

    border-color: #66c0f4;

    box-shadow:
        0 12px 35px rgba(0,0,0,.45);
}

.game-image {
    width: 100%;
    height: 165px;

    display: block;

    object-fit: cover;

    background: #101318;
}

.game-info {
    padding: 18px;
}

.game-name {
    font-size: 20px;
    font-weight: 700;

    margin-bottom: 10px;
}

.game-description {
    color: #9da9b5;

    font-size: 14px;
    line-height: 1.5;

    min-height: 42px;

    margin-bottom: 18px;
}

.play-button {
    width: 100%;

    display: block;

    padding: 12px 15px;

    background:
        linear-gradient(
            90deg,
            #75c8f5,
            #4b9dcc
        );

    color: #fff;

    text-align: center;
    text-decoration: none;

    font-weight: 700;

    border: none;

    cursor: pointer;

    transition: filter .2s ease;
}

.play-button:hover {
    filter: brightness(1.12);
}

/* =========================================================
   ŽIADNE VÝSLEDKY
========================================================= */

.no-results {
    display: none;

    padding: 70px 20px;

    text-align: center;

    color: #7d8b99;

    font-size: 18px;
}

/* =========================================================
   PLAYER
========================================================= */

.player {
    position: fixed;
    inset: 0;

    z-index: 1000;

    display: none;
    flex-direction: column;

    background: #0d1015;
}

.player.active {
    display: flex;
}

.player-header {
    height: 62px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: #171a21;
    border-bottom: 1px solid #303641;
}

.player-title {
    font-size: 18px;
    font-weight: 700;
}

.player-actions {
    display: flex;
    gap: 10px;
}

.player-button {
    padding: 9px 15px;

    background: #2a3039;
    border: 1px solid #3a414c;

    color: #fff;

    cursor: pointer;
}

.player-button:hover {
    background: #3a414c;
}

.player-close:hover {
    background: #a93226;
}

.game-frame {
    width: 100%;
    height: 100%;

    flex: 1;

    border: none;

    background: #fff;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top: 80px;

    padding: 35px 20px;

    text-align: center;

    border-top: 1px solid #2a3039;

    color: #697582;

    font-size: 14px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 750px) {

    .header {
        height: auto;

        padding: 15px 5%;

        flex-wrap: wrap;

        gap: 15px;
    }

    .nav {
        order: 3;

        width: 100%;

        justify-content: center;
    }

    .search-box {
        width: 180px;
    }

    .hero {
        min-height: 270px;

        padding: 40px 7%;
    }

    .hero h1 {
        font-size: 38px;
    }

    .hero p {
        font-size: 16px;
    }

    .container {
        width: 92%;
    }

    .games-grid {
        grid-template-columns:
            repeat(auto-fill, minmax(220px, 1fr));
    }

}

/* =========================================================
   VEĽMI MALÉ MOBILY
========================================================= */

@media (max-width: 450px) {

    .logo {
        font-size: 22px;
    }

    .search-box {
        width: 150px;
    }

    .games-grid {
        grid-template-columns: 1fr;
    }

}
</style>
</head>

/* =========================================================
   SYSTÉM
========================================================= */

const games = [];


/*
   Pridanie hry do systému.

   Prázdne hry sa ignorujú.
*/

function addGame(game) {

    if (!game) {
        return;
    }

    const name =
        String(game.name || "").trim();

    const description =
        String(game.description || "").trim();

    const image =
        String(game.image || "").trim();

    const link =
        String(game.link || "").trim();


    /*
       Ak nie je názov ani link,
       slot sa nepoužije.
    */

    if (!name || !link) {
        return;
    }


    games.push({

        name: name,

        description:
            description || "Bez popisu.",

        image:
            image,

        link:
            link

    });

}


/* =========================================================
   HTML OCHRANA
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* =========================================================
   PLACEHOLDER OBRÁZOK
========================================================= */

function createPlaceholder(name) {

    const safeName =
        String(name)
            .replace(/[<>&"']/g, "")
            .slice(0, 35);


    const svg = `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="900"
            height="500"
        >

            <rect
                width="900"
                height="500"
                fill="#1e232b"
            />

            <text
                x="450"
                y="250"
                fill="#66c0f4"
                font-size="42"
                font-family="Arial"
                text-anchor="middle"
                dominant-baseline="middle"
            >
                ${safeName}
            </text>

        </svg>
    `;


    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

}


/* =========================================================
   VYKRESLENIE HIER
========================================================= */

function renderGames(list = games) {

    const grid =
        document.getElementById("gamesGrid");

    const noResults =
        document.getElementById("noResults");

    const gameCount =
        document.getElementById("gameCount");


    grid.innerHTML = "";


    gameCount.textContent =
        list.length +
        (list.length === 1 ? " hra" : " hier");


    if (list.length === 0) {

        noResults.style.display = "block";

        return;

    }


    noResults.style.display = "none";


    list.forEach((game) => {

        const card =
            document.createElement("article");

        card.className =
            "game-card";


        const image =
            game.image ||
            createPlaceholder(game.name);


        card.innerHTML = `

            <img
                class="game-image"
                src="${escapeAttribute(image)}"
                alt="${escapeAttribute(game.name)}"
                loading="lazy"
            >

            <div class="game-info">

                <div class="game-name">
                    ${escapeHtml(game.name)}
                </div>

                <div class="game-description">
                    ${escapeHtml(game.description)}
                </div>

                <button
                    class="play-button"
                    type="button"
                >
                    ▶ HRAŤ
                </button>

            </div>

        `;


        const button =
            card.querySelector(".play-button");


        button.addEventListener(
            "click",
            () => openGame(game)
        );


        /*
           Ak obrázok nefunguje,
           použije sa automatický placeholder.
        */

        const imageElement =
            card.querySelector(".game-image");


        imageElement.addEventListener(
            "error",
            () => {

                imageElement.src =
                    createPlaceholder(game.name);

            }
        );


        grid.appendChild(card);

    });

}


/* =========================================================
   OTVORENIE HRY
========================================================= */

let currentGame = null;


function openGame(game) {

    if (!game || !game.link) {

        alert(
            "Táto hra nemá nastavený link."
        );

        return;

    }


    currentGame = game;


    const player =
        document.getElementById("player");

    const title =
        document.getElementById("playerTitle");

    const frame =
        document.getElementById("gameFrame");

    const externalButton =
        document.getElementById(
            "openExternalButton"
        );


    title.textContent =
        game.name;


    /*
       Hru načítame priamo do iframe.
    */

    frame.src =
        game.link;


    /*
       Tlačidlo na otvorenie hry
       v samostatnej karte.
    */

    externalButton.onclick =
        function() {

            window.open(
                game.link,
                "_blank",
                "noopener,noreferrer"
            );

        };


    player.classList.add("active");


    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   ZATVORENIE HRY
========================================================= */

function closeGame() {

    const player =
        document.getElementById("player");

    const frame =
        document.getElementById("gameFrame");


    player.classList.remove("active");


    /*
       Zastaví hru po zatvorení playera.
    */

    frame.src = "";


    currentGame = null;


    document.body.style.overflow =
        "";

}


/* =========================================================
   ESC = ZATVORIŤ HRU
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            currentGame
        ) {

            closeGame();

        }

    }
);


/* =========================================================
   VYHĽADÁVANIE
========================================================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );


searchInput.addEventListener(
    "input",
    function() {

        const query =
            this.value
                .toLowerCase()
                .trim();


        if (!query) {

            renderGames(games);

            return;

        }


        const filtered =
            games.filter(game => {

                return (

                    game.name
                        .toLowerCase()
                        .includes(query)

                    ||

                    game.description
                        .toLowerCase()
                        .includes(query)

                );

            });


        renderGames(filtered);

    }
);

function scrollToGames() {

    document
        .getElementById("gamesSection")
        .scrollIntoView({
            behavior: "smooth"
        });

}

function goHome() {

    window.scrollTo({

}

renderGames();
